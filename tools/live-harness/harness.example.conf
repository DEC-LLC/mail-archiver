# Live harness configuration: example.
#
# Copy to tools/live-harness/harness.local.conf (ignored by git) and fill in, or set
# the same names as environment variables; the environment wins over the file.
# MA_HARNESS_CONFIG=/path/to/file names another config file.
# With IMAP_HOST, ADDRESS or PASSWORD_FILE missing the harness names them and exits 2
# without connecting anywhere.
#
# Use a TEST mailbox on an IMAP server you control: the harness delivers mail to it
# (and removes exactly those messages again at the end).

# IMAP server of the test mailbox. Implicit TLS (IMAPS) only. Required.
MA_HARNESS_IMAP_HOST=mail.example.org

# IMAP port. Default 993.
MA_HARNESS_IMAP_PORT=993

# SMTP server that accepts mail for the test mailbox from the machine running the
# harness: plain SMTP, no authentication, envelope sender = the mailbox itself.
# Default: the IMAP host.
MA_HARNESS_SMTP_HOST=mail.example.org

# SMTP port. Default 25.
MA_HARNESS_SMTP_PORT=25

# Address of the test mailbox; also its IMAP login. Required.
MA_HARNESS_ADDRESS=mail-archiver-test@example.org

# File that holds the mailbox password (one line). Mounted read-only into the
# container; never printed, never copied into the report. Required.
MA_HARNESS_PASSWORD_FILE=/home/you/.secrets/mail-archiver-test.password

# CA certificate(s), PEM, that the server's certificate chains to, when it is not a
# public CA: one certificate per file, several files separated by commas (root and
# intermediate, for example). Installed in the throwaway container only.
# Empty or absent: the container's own trust store.
MA_HARNESS_CA_FILE=/etc/ssl/local/example-root-ca.crt,/etc/ssl/local/example-intermediate-ca.crt

# Filler mail. Empty or absent: the harness generates it. Otherwise up to five folders
# that hold one message per file (a Maildir's cur/, for example), separated by commas;
# the harness reads them and never changes them. Each folder needs a few hundred
# messages when read over ssh (the sets start at offsets up to 800).
MA_HARNESS_FILLER_DIRS=

# user@host: read the FILLER_DIRS folders on that host over ssh (BatchMode) instead of
# locally. Empty or absent: local folders.
MA_HARNESS_FILLER_SSH=
