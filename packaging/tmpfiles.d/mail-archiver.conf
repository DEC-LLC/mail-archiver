# mail-archiver runtime dir — /run is tmpfs, so this recreates it
# on boot. Mail-archiver group can write markers (restart-requested,
# restart-pending); root reads them via the mail-archiver-restart.path
# unit.
d /run/mail-archiver 0770 root mail-archiver -
# 1.1.0: per-job state files for the systemd-scoped sync lifecycle.
# Gunicorn workers (as mail-archiver) create + atomically rewrite
# <job_id>.json here every ~2s during a sync. Any worker (or the admin
# page) can read the same files for cross-worker + logout/login SSE
# reattach.
d /run/mail-archiver/sync-jobs 0770 root mail-archiver -
